services:
  # ==================== Infrastructure Services ====================
  mongo:
    image: mongo:7
    container_name: mongo_prod
    command: [ "--replSet", "rs0", "--bind_ip_all" ]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: |
        mongosh --eval "try { rs.status().ok } catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 10s
      start_period: 30s
    restart: always

  redis:
    image: redis:7
    container_name: redis_prod
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq_prod
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  # ==================== Application Services ====================
  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: api-service-prod
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URL: ${MONGO_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  audit-service:
    build:
      context: ./audit-service
      dockerfile: Dockerfile
    container_name: audit-service-prod
    ports:
      - "${AUDIT_PORT:-5001}:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGO_URL: ${MONGO_URL_AUDIT}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service-prod
    ports:
      - "${ANALYTICS_PORT:-5002}:5002"
    environment:
      NODE_ENV: production
      PORT: 5002
      MONGO_URL: ${MONGO_URL_ANALYTICS}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

volumes:
  mongo_data:
