paths:
  # ==================== CHECKOUT PREVIEW ====================
  /api/v1/{app}/checkout/preview:
    get:
      tags:
        - Checkout
      summary: Get checkout preview for a room
      description: |
        Returns pending food orders and service requests for an active room session.
        Uses stored bill values – no recalculation. Subtotal is the sum of all order/service `toPay` amounts.
        Includes guest details from room session metadata when available.
        **roomSessionId** can be obtained from the QR codes API (`GET /qr-codes/hotels/:hotelId`) when a room has `roomStatus: "OCCUPIED"`.
        Requires CHECK_IN_GUEST permission (frontdesk).
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
        - name: roomSessionId
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: "507f1f77bcf86cd799439011"
      responses:
        "200":
          description: Checkout preview with food orders, service requests, and subtotal
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/CheckoutPreview"
        "400":
          description: No active room session for this room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden – CHECK_IN_GUEST required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ==================== PROCEED CHECKOUT ====================
  /api/v1/{app}/checkout/proceed:
    post:
      tags:
        - Checkout
      summary: Proceed checkout
      description: |
        Applies adjustments (discount, damage, other), records payment method, marks orders paid,
        and checks out the room. No payment gateway – front desk processes payment offline.
        Adjustments: DISCOUNT (reduces), DAMAGE (adds), OTHER (adds, optional label).
        Payment methods: CASH, CARD, UPI, BANK_TRANSFER, OTHER.
        Requires CHECK_IN_GUEST permission (frontdesk).
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProceedCheckoutInput"
      responses:
        "200":
          description: Checkout completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Checkout completed successfully"
                  data:
                    $ref: "#/components/schemas/ProceedCheckoutResult"
        "400":
          description: Bad request (e.g. no active room session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden – CHECK_IN_GUEST required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ==================== DOWNLOAD CHECKOUT BILL PDF ====================
  /api/v1/{app}/checkout/{checkoutSessionId}/bill-pdf:
    get:
      tags:
        - Checkout
      summary: Download checkout bill PDF
      description: |
        Returns a PDF bill for a completed checkout session. Includes hotel name, logo,
        address, contact, GST/PAN/FSSAI, room number, checkout timestamp, food orders,
        service requests, adjustments, and final amount. Footer: "Generated by TableMitra".
        Requires CHECK_IN_GUEST permission (frontdesk).
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
        - name: checkoutSessionId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="checkout-bill-507f1f77bcf86cd799439011.pdf"'
        "404":
          description: Checkout session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden – CHECK_IN_GUEST required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    CheckoutPreview:
      type: object
      properties:
        roomSessionId:
          type: string
          example: "507f1f77bcf86cd799439011"
        roomNumber:
          type: string
          example: "101"
        hotelId:
          type: string
          example: "507f1f77bcf86cd799439020"
        foodOrders:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              items:
                type: array
                items:
                  type: object
                  properties:
                    itemName: { type: string }
                    quantity: { type: integer }
                    variantName: { type: string }
              bill:
                type: object
                properties:
                  subtotal: { type: number }
                  toPay: { type: number }
              count: { type: integer }
              createdAt: { type: string, format: date-time }
        serviceRequests:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              items:
                type: array
              totalAmount: { type: number }
              bill:
                type: object
                properties:
                  toPay: { type: number }
              createdAt: { type: string, format: date-time }
        ordersSubtotal:
          type: number
          example: 1250.50
        guestDetails:
          type: array
          nullable: true
          items:
            type: object
            properties:
              name: { type: string }
              phone: { type: string }

    ProceedCheckoutInput:
      type: object
      required:
        - hotelId
        - roomNumber
        - paymentMethod
      properties:
        hotelId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        roomNumber:
          type: string
          minLength: 1
          maxLength: 50
        adjustments:
          type: array
          default: []
          items:
            type: object
            required:
              - type
              - amount
            properties:
              type:
                type: string
                enum: [DISCOUNT, DAMAGE, OTHER]
              amount:
                type: number
                minimum: 0
              label:
                type: string
                maxLength: 200
        paymentMethod:
          type: string
          enum: [CASH, CARD, UPI, BANK_TRANSFER, OTHER]
        guestDetails:
          type: object
          properties:
            name: { type: string, maxLength: 200 }
            phone: { type: string, maxLength: 20 }

    ProceedCheckoutResult:
      type: object
      properties:
        checkoutSessionId:
          type: string
          example: "507f1f77bcf86cd799439030"
        finalAmount:
          type: number
          example: 1100.00
        roomNumber:
          type: string
          example: "101"
        hotelId:
          type: string
          example: "507f1f77bcf86cd799439020"
