paths:
  # ==================== CHECKOUT PREVIEW ====================
  /api/v1/{app}/checkout/preview:
    get:
      tags:
        - Checkout
      summary: Get checkout preview for a room
      description: |
        Returns food orders and service requests for a room session (active or past checkout).
        Accepts **roomSessionId** (from Room View / QR) or **checkoutSessionId** (from History).
        When **isAlreadyCheckout** is true, only Print Bill is shown; when false, Proceed + Print Bill.
        For past checkouts, includes adjustments and finalAmount from the CheckoutSession.
        Requires CHECK_IN_GUEST permission (frontdesk).
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
        - name: roomSessionId
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: "507f1f77bcf86cd799439011"
          description: Room session ID (active or checked-out)
        - name: checkoutSessionId
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
            example: "507f1f77bcf86cd799439012"
          description: Checkout session ID (from history); provide one of roomSessionId or checkoutSessionId
      responses:
        "200":
          description: Checkout preview with food orders, service requests, and subtotal
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/CheckoutPreview"
        "400":
          description: No active room session for this room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden – CHECK_IN_GUEST required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ==================== PROCEED CHECKOUT ====================
  /api/v1/{app}/checkout/proceed:
    post:
      tags:
        - Checkout
      summary: Proceed checkout
      description: |
        Applies adjustments (discount, damage, other), records payment method, marks orders paid,
        and checks out the room. No payment gateway – front desk processes payment offline.
        Adjustments: DISCOUNT (reduces), DAMAGE (adds), OTHER (adds, optional label).
        Payment methods: CASH, CARD, UPI, BANK_TRANSFER, OTHER.
        Requires CHECK_IN_GUEST permission (frontdesk).
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProceedCheckoutInput"
      responses:
        "200":
          description: Checkout completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Checkout completed successfully"
                  data:
                    $ref: "#/components/schemas/ProceedCheckoutResult"
        "400":
          description: Bad request (e.g. no active room session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden – CHECK_IN_GUEST required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ==================== CHECKOUT HISTORY ====================
  /api/v1/{app}/checkout/history:
    get:
      tags:
        - Checkout
      summary: Get checkout history
      description: |
        Returns a paginated list of past checkout sessions for the hotel.
        Hotel scope is taken from JWT context (staff must have hotel context).
        Smart search supports room number, guest name, guest phone, roomSessionId, or checkoutSessionId.
        Requires CHECK_IN_GUEST permission (frontdesk).
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: Smart search (room number, guest name, guest phone, or ID)
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Paginated checkout history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CheckoutHistoryItem"
                  total:
                    type: integer
                    example: 42
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
        "403":
          description: Hotel context required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden – CHECK_IN_GUEST required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ==================== DOWNLOAD CHECKOUT BILL PDF ====================
  /api/v1/{app}/checkout/bill-pdf:
    get:
      tags:
        - Checkout
      summary: Download checkout bill PDF
      description: |
        Returns a PDF bill for a completed checkout session. Uses roomSessionId – the same
        identifier used for preview and proceed. Looks up the CheckoutSession by roomSessionId.
        Includes hotel name, logo, address, contact, GST/PAN/FSSAI, room number, checkout
        timestamp, food orders, service requests, adjustments, and final amount.
        Requires CHECK_IN_GUEST permission (frontdesk). Returns 404 if checkout not completed for this room.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
        - name: roomSessionId
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Room session ID (from preview; checkout must be completed first)
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="checkout-bill-507f1f77bcf86cd799439011.pdf"'
        "404":
          description: Checkout not found for this room session (proceed checkout first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden – CHECK_IN_GUEST required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    CheckoutPreview:
      type: object
      properties:
        roomSessionId:
          type: string
          example: "507f1f77bcf86cd799439011"
        roomNumber:
          type: string
          example: "101"
        hotelId:
          type: string
          example: "507f1f77bcf86cd799439020"
        foodOrders:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              items:
                type: array
                items:
                  type: object
                  properties:
                    itemName: { type: string }
                    quantity: { type: integer }
                    variantName: { type: string }
              bill:
                type: object
                properties:
                  subtotal: { type: number }
                  toPay: { type: number }
              count: { type: integer }
              createdAt: { type: string, format: date-time }
        serviceRequests:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
              items:
                type: array
              totalAmount: { type: number }
              bill:
                type: object
                properties:
                  toPay: { type: number }
              createdAt: { type: string, format: date-time }
        ordersSubtotal:
          type: number
          example: 1250.50
        checkoutSessionId:
          type: string
          description: Present when isAlreadyCheckout; use for Print Bill API
        isAlreadyCheckout:
          type: boolean
          description: When true, show only Print Bill; when false, show Proceed + Print Bill
        adjustments:
          type: array
          description: Applied adjustments (only when isAlreadyCheckout)
          items:
            type: object
            properties:
              type: { type: string, enum: [DISCOUNT, DAMAGE, OTHER] }
              amount: { type: number }
              label: { type: string }
        finalAmount:
          type: number
          description: Final billed amount (only when isAlreadyCheckout)
        guestDetails:
          type: array
          nullable: true
          items:
            type: object
            properties:
              name: { type: string }
              phone: { type: string }

    CheckoutHistoryItem:
      type: object
      properties:
        checkoutSessionId:
          type: string
        roomSessionId:
          type: string
        roomNumber:
          type: string
        paidAt:
          type: string
          format: date-time
        finalAmount:
          type: number
        guestDetails:
          type: object
          properties:
            name: { type: string }
            phone: { type: string }

    ProceedCheckoutInput:
      type: object
      required:
        - roomSessionId
        - paymentMethod
      properties:
        roomSessionId:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          description: Room session ID from preview
        adjustments:
          type: array
          default: []
          items:
            type: object
            required:
              - type
              - amount
            properties:
              type:
                type: string
                enum: [DISCOUNT, DAMAGE, OTHER]
              amount:
                type: number
                minimum: 0
              label:
                type: string
                maxLength: 200
        paymentMethod:
          type: string
          enum: [CASH, CARD, UPI, BANK_TRANSFER, OTHER]
        guestDetails:
          type: object
          properties:
            name: { type: string, maxLength: 200 }
            phone: { type: string, maxLength: 20 }

    ProceedCheckoutResult:
      type: object
      properties:
        checkoutSessionId:
          type: string
          example: "507f1f77bcf86cd799439030"
        finalAmount:
          type: number
          example: 1100.00
        roomNumber:
          type: string
          example: "101"
        hotelId:
          type: string
          example: "507f1f77bcf86cd799439020"
