paths:
  # ==================== ADMIN ENDPOINTS ====================
  /api/v1/{app}/company/admins:
    get:
      tags:
        - Company - Admins
      summary: List all admins
      description: Get paginated list of admin profiles
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
            enum: [admin]
          description: Must be 'admin'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Items per page
        - name: search
          in: query
          schema:
            type: string
          description: Search by name or email
        - name: isActive
          in: query
          schema:
            type: boolean
          description: Filter by active status
      responses:
        "200":
          description: List of admins
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminProfile"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden - Missing MANAGE_ADMINS permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags:
        - Company - Admins
      summary: Onboard new admin
      description: Create a new admin profile with user account
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
            enum: [admin]
          description: Must be 'admin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminInput"
      responses:
        "201":
          description: Admin onboarded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Admin onboarded successfully"
                  data:
                    $ref: "#/components/schemas/AdminProfile"
        "400":
          description: Bad request - Email exists or user already has role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden - Missing MANAGE_ADMINS permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/{app}/company/admins/{id}:
    get:
      tags:
        - Company - Admins
      summary: Get admin by ID
      description: Get a specific admin profile by ID
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
            enum: [admin]
          description: Must be 'admin'
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Admin profile ID (MongoDB ObjectId)
      responses:
        "200":
          description: Admin profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/AdminProfile"
        "404":
          description: Admin not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      tags:
        - Company - Admins
      summary: Update admin
      description: Update an existing admin profile
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
            enum: [admin]
          description: Must be 'admin'
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Admin profile ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminInput"
      responses:
        "200":
          description: Admin updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Admin updated successfully"
                  data:
                    $ref: "#/components/schemas/AdminProfile"
        "400":
          description: Bad request - Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags:
        - Company - Admins
      summary: Deactivate admin
      description: Soft delete (deactivate) an admin profile
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - name: app
          in: path
          required: true
          schema:
            type: string
            enum: [admin]
          description: Must be 'admin'
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
          description: Admin profile ID
      responses:
        "200":
          description: Admin deactivated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

