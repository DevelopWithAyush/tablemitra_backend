# ==================== SCHEMAS ====================
components:
  schemas:
    AdminProfile:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        userId:
          type: object
          properties:
            _id:
              type: string
            phone:
              type: string
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          example: "john@tablemitra.com"
        isEmailVerified:
          type: boolean
          example: false
        profilePicture:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            url:
              type: string
            type:
              type: string
        isActive:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAdminInput:
      type: object
      required:
        - phone
        - name
        - email
      properties:
        phone:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
          example: "+919876543210"
          description: Phone number with country code
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john@tablemitra.com"

    UpdateAdminInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        profilePicture:
          type: string
          description: Attachment ID (MongoDB ObjectId)
        isActive:
          type: boolean

    CustomerCareProfile:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        userId:
          type: object
          properties:
            _id:
              type: string
            phone:
              type: string
        employeeCode:
          type: string
          example: "TMC001"
          description: Auto-generated employee code
        designation:
          type: string
          enum: [CUSTOMER_CARE, CUSTOMER_CARE_LEAD, CUSTOMER_CARE_MANAGER]
          example: "CUSTOMER_CARE"
        name:
          type: string
          example: "Jane Smith"
        email:
          type: string
          example: "jane@tablemitra.com"
        isEmailVerified:
          type: boolean
        profilePicture:
          type: object
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCustomerCareInput:
      type: object
      required:
        - phone
        - name
        - email
        - designation
      properties:
        phone:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
          example: "+919876543211"
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Jane Smith"
        email:
          type: string
          format: email
          example: "jane@tablemitra.com"
        designation:
          type: string
          enum: [CUSTOMER_CARE, CUSTOMER_CARE_LEAD, CUSTOMER_CARE_MANAGER]
          example: "CUSTOMER_CARE"

    UpdateCustomerCareInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        designation:
          type: string
          enum: [CUSTOMER_CARE, CUSTOMER_CARE_LEAD, CUSTOMER_CARE_MANAGER]
        profilePicture:
          type: string
        isActive:
          type: boolean

    SalesProfile:
      type: object
      properties:
        _id:
          type: string
          example: "507f1f77bcf86cd799439011"
        userId:
          type: object
          properties:
            _id:
              type: string
            phone:
              type: string
        employeeCode:
          type: string
          example: "TMS001"
          description: Auto-generated employee code
        name:
          type: string
          example: "Bob Wilson"
        email:
          type: string
          example: "bob@tablemitra.com"
        isEmailVerified:
          type: boolean
        profilePicture:
          type: object
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSalesInput:
      type: object
      required:
        - phone
        - name
        - email
      properties:
        phone:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
          example: "+919876543212"
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: "Bob Wilson"
        email:
          type: string
          format: email
          example: "bob@tablemitra.com"

    UpdateSalesInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
        profilePicture:
          type: string
        isActive:
          type: boolean
