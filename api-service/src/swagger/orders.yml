paths:
  # ==================== ACTIVE ORDERS — BOTTOM BAR SUMMARY ====================
  /api/v1/{app}/orders/active:
    get:
      tags:
        - Active Orders
      summary: Bottom-bar summary of all active orders (customer only)
      description: |
        Returns the minimum data needed to render the bottom tracking bar.
        - **Food orders** with status `PENDING` or `PREPARING`
        - **Service requests** with status `PENDING`, `ACCEPTED`, or `IN_PROGRESS`

        Only `_id`, `status`, and `createdAt` are returned per entry — no item lists.
        The frontend uses this once on load; afterwards all status changes arrive via
        socket events (`food.order.preparing`, `service.request.accepted`, etc.) so no
        polling is required.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
      responses:
        "200":
          description: Active order summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      foodOrders:
                        type: array
                        items:
                          $ref: "#/components/schemas/ActiveFoodOrderSummary"
                      serviceRequests:
                        type: array
                        items:
                          $ref: "#/components/schemas/ActiveServiceRequestSummary"
              example:
                success: true
                data:
                  foodOrders:
                    - _id: "abc123"
                      status: "PREPARING"
                      createdAt: "2025-01-01T10:00:00.000Z"
                    - _id: "abc124"
                      status: "PENDING"
                      createdAt: "2025-01-01T10:05:00.000Z"
                  serviceRequests:
                    - _id: "def456"
                      status: "IN_PROGRESS"
                      createdAt: "2025-01-01T10:02:00.000Z"
        "401":
          $ref: "#/components/responses/OrderUnauthorized"

  # ==================== ACTIVE FOOD ORDERS — STATUS PAGE ====================
  /api/v1/{app}/orders/food/active:
    get:
      tags:
        - Active Orders
      summary: Full active food orders for the status carousel (customer only)
      description: |
        Returns complete data for all active food orders (`PENDING` | `PREPARING`)
        so the status page can render a per-order carousel with progress animations.

        - Sorted **oldest-first** so the first order placed appears first in the carousel.
        - Includes item names, bill totals, hotel name/address, and `acceptedAt` timestamp.
        - No pagination — a customer will rarely have more than 2-3 active orders at once.

        **Animation states the frontend should drive:**
        - `PENDING` → pulse / waiting animation
        - `PREPARING` → progress / cooking animation
        - Terminal (`SERVED`, `REJECTED`) → card disappears (driven by socket event)
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
      responses:
        "200":
          description: Active food orders for carousel
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActiveFoodOrder"
        "401":
          $ref: "#/components/responses/OrderUnauthorized"

  # ==================== ACTIVE SERVICE REQUESTS — STATUS PAGE ====================
  /api/v1/{app}/orders/service/active:
    get:
      tags:
        - Active Orders
      summary: Full active service requests for the status carousel (customer only)
      description: |
        Returns complete data for all active service requests
        (`PENDING` | `ACCEPTED` | `IN_PROGRESS`) so the status page can render a
        per-request carousel with progress animations.

        - Sorted **oldest-first** so the earliest request appears first in the carousel.
        - Includes item names (with category for grouping), hotel name/address,
          `acceptedAt`, and `startedAt` timestamps.
        - No pagination — a customer rarely has many concurrent service requests.

        **Animation states the frontend should drive:**
        - `PENDING` → pulse / waiting animation
        - `ACCEPTED` → accepted / confirmed animation
        - `IN_PROGRESS` → spinner / active animation
        - Terminal (`COMPLETED`, `REJECTED`, `CANCELLED`) → card disappears (driven by socket event)
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
      responses:
        "200":
          description: Active service requests for carousel
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ActiveServiceRequest"
        "401":
          $ref: "#/components/responses/OrderUnauthorized"

  # ==================== PLACE FOOD ORDER ====================
  /api/v1/{app}/orders/food:
    post:
      tags:
        - Orders
      summary: Place a food order
      description: |
        Single API for both customer and staff (role-based behaviour).
        - **Customer** (app=customer): Room context from cookies (`customer_room_hotel_id`, `customer_room_session_id`, `customer_room_room_number`). Do not send `roomNumber`; it is ignored. Order is created with source GUEST, channelType ROOM.
        - **Staff** (manager, frontdesk, kitchen, room-service): Send `roomNumber` to place order for a guest room. Backend resolves active room session; returns 400 "No active room session for this room" if none. Hotel from JWT ctx. Optional `forStaff: true` to place order for staff (no room). Order is created with source STAFF_FOR_GUEST or STAFF.
        Requires authentication (Bearer or cookie).
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/OrderItemInput"
                roomNumber:
                  type: string
                  maxLength: 20
                  description: "Required for staff when placing order for a guest room. Ignored for customer."
                forStaff:
                  type: boolean
                  default: false
                  description: "When true (staff only), order is for staff (no room)."
                cookingRequest:
                  type: string
                  maxLength: 500
                  description: "Order-level free-text cooking request / special instructions (e.g. no onion, less spicy)."
            examples:
              customerOrder:
                summary: Customer places own order (room from cookies)
                description: Use with app=customer. Room context from cookies; do not send roomNumber. Items can include variantId/variantName, discountedPrice, isUpsell.
                value:
                  items:
                    - itemId: "6990a1b9624644e833e5a32a"
                      itemName: "Chicken Burger"
                      price: 100
                      discountedPrice: 100
                      quantity: 1
                      isUpsell: false
                    - itemId: "6990a6f7624644e833e5a44f"
                      itemName: "Cheez Corn Pizza"
                      price: 270
                      discountedPrice: 270
                      quantity: 1
                      variantId: "699199777371029da1b06ea0"
                      variantName: "Half"
                      isUpsell: false
                    - itemId: "69919258c28a27aebd364912"
                      itemName: "Pizza 01 Large"
                      price: 699
                      quantity: 1
                      isUpsell: true
                  cookingRequest: "No onion, less spicy please"
              staffForGuest:
                summary: Staff places order for guest (room)
                description: Use with app=manager, frontdesk, kitchen or room-service. Send roomNumber; backend resolves room session.
                value:
                  items:
                    - itemId: "6990a1b9624644e833e5a32a"
                      itemName: "Chicken Burger"
                      price: 100
                      quantity: 1
                      isUpsell: false
                    - itemId: "507f1f77bcf86cd799439012"
                      itemName: "Garlic Bread"
                      price: 149
                      discountedPrice: 129
                      quantity: 2
                      isUpsell: false
                  roomNumber: "101"
                  cookingRequest: "Extra napkins, serve together"
              staffForStaff:
                summary: Staff places order for staff (self / internal)
                description: Use with staff app. Order is for staff (no room); no roomNumber.
                value:
                  items:
                    - itemId: "507f1f77bcf86cd799439011"
                      itemName: "Staff Meal"
                      price: 99
                      quantity: 1
                      isUpsell: false
                  forStaff: true
                  cookingRequest: "No ice"
      responses:
        "201":
          description: Food order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Food order created successfully"
                  data:
                    $ref: "#/components/schemas/FoodOrder"
        "400":
          description: Bad request (e.g. room context required, no active room session)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderError"

    get:
      tags:
        - Orders
      summary: Get food orders (paginated, search)
      description: |
        Role-based listing and enrichment:
        - **Customer** (app=customer): Orders where placedById or customerId is the user. Response includes `hotel` (name, address) per order.
        - **Staff** (hotel context): Orders for the staff's hotel (JWT ctx.id). Response includes `customer` (userId, phone, name, profilePicture) per order.
        - **Admin/Chain** (chain context): Orders for hotels in the chain. Response includes `hotel` and `customer` (with name and profile) per order.
        Pagination uses `page` and `limit`. `search` matches room number and table number (case-insensitive). Order identity is MongoDB `_id`.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: Smart search on room number and table number
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, PREPARING, SERVED, REJECTED]
          description: "Filter by order status. Orders are always sorted by createdAt descending (newest first)."
      responses:
        "200":
          description: Paginated list of orders with role-based enrichment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      orders:
                        type: array
                        items:
                          $ref: "#/components/schemas/OrderListItem"
                      total:
                        type: integer
                        example: 50
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
                      hasMore:
                        type: boolean
                        example: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderError"

  # ==================== PLACE SERVICE REQUEST ====================
  /api/v1/{app}/orders/service:
    post:
      tags:
        - Service Requests
      summary: Place a service request
      description: |
        Single API for both customer and staff. Covers any room service type: laundry, housekeeping, amenities, etc.
        - **Customer** (app=customer): Room context from cookies (`customer_room_hotel_id`, `customer_room_session_id`, `customer_room_room_number`). Do not send `roomNumber`.
        - **Staff** (manager, frontdesk, room-service): Send `roomNumber` to place on behalf of a guest. Backend resolves the active room session.
        Requires `CREATE_SERVICE_REQUEST` permission. Emits a `SERVICE_REQUEST_CREATED` socket alert routed to `ROOM_SERVICE` → `FRONT_DESK` based on panel presence.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/ServiceRequestItemInput"
                roomNumber:
                  type: string
                  maxLength: 20
                  description: "Required for staff placing on behalf of a guest. Ignored for customer."
                note:
                  type: string
                  maxLength: 500
                  description: "Optional free-text note from the guest (e.g. 'collect after 3pm')."
            examples:
              customerRequest:
                summary: Customer places their own request (room from cookies)
                description: Only itemId + quantity. Backend resolves name, category, and price from DB.
                value:
                  items:
                    - itemId: "6990a1b9624644e833e5a32a"
                      quantity: 2
                    - itemId: "6990a6f7624644e833e5a44f"
                      quantity: 3
                  note: "Please collect at 3pm"
              staffForGuest:
                summary: Staff places request for a guest room
                description: Only itemId + quantity. Send roomNumber so backend resolves the active room session.
                value:
                  items:
                    - itemId: "6990a1b9624644e833e5a32a"
                      quantity: 1
                  roomNumber: "205"
                  note: "Guest requested urgent delivery"
      responses:
        "201":
          description: Service request created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Service request created successfully"
                  data:
                    $ref: "#/components/schemas/ServiceRequest"
        "400":
          $ref: "#/components/responses/OrderBadRequest"
        "401":
          $ref: "#/components/responses/OrderUnauthorized"
        "403":
          $ref: "#/components/responses/OrderForbidden"

  # ==================== GET SERVICE REQUESTS ====================
    get:
      tags:
        - Service Requests
      summary: Get service requests (paginated, filtered)
      description: |
        Role-based listing:
        - **Customer** (app=customer): Requests placed by the caller. Response includes `hotel` (name, address).
        - **Staff** (hotel context — frontdesk, room-service, manager): All requests for the staff's hotel. Response includes `customer` (userId, phone, name, profilePicture).
        - **Admin/Chain**: Requests across all hotels in the chain. Response includes both `hotel` and `customer`.
        Requires `VIEW_SERVICE_REQUEST` permission.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
          description: "Search by room number (case-insensitive)"
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, ACCEPTED, IN_PROGRESS, COMPLETED, REJECTED, CANCELLED]
          description: "Filter by request status. When omitted, all statuses are returned."
      responses:
        "200":
          description: Paginated list of service requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      requests:
                        type: array
                        items:
                          $ref: "#/components/schemas/ServiceRequestListItem"
                      total:
                        type: integer
                        example: 42
                      page:
                        type: integer
                        example: 1
                      limit:
                        type: integer
                        example: 20
                      hasMore:
                        type: boolean
                        example: true
        "401":
          $ref: "#/components/responses/OrderUnauthorized"
        "403":
          $ref: "#/components/responses/OrderForbidden"

  # ==================== UPDATE SERVICE REQUEST STATUS ====================
  /api/v1/{app}/orders/service/{requestId}/status:
    patch:
      tags:
        - Service Requests
      summary: Update service request status
      description: |
        Updates the status of a service request. Access control and valid transitions:
        - **Customer**: May only move `PENDING → CANCELLED` on their own request.
        - **Staff / Admin** (hotel or chain context): Full transition set below.

        Valid transitions:
        | From       | Allowed targets                        |
        |------------|----------------------------------------|
        | PENDING    | ACCEPTED, REJECTED, CANCELLED          |
        | ACCEPTED   | IN_PROGRESS, REJECTED, CANCELLED       |
        | IN_PROGRESS| COMPLETED, CANCELLED                   |

        Emits a status-specific socket event to `hotel:{hotelId}` (staff) and `room:{roomSessionId}` (guest).
        Publishes analytics and audit events for every transition.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Service request ID (MongoDB ObjectId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ACCEPTED, IN_PROGRESS, COMPLETED, REJECTED, CANCELLED]
                  description: "New status. Customer may only send CANCELLED."
            examples:
              accept:
                summary: Staff accepts the request
                value: { status: "ACCEPTED" }
              startWork:
                summary: Staff marks it in progress
                value: { status: "IN_PROGRESS" }
              complete:
                summary: Staff completes the request
                value: { status: "COMPLETED" }
              reject:
                summary: Staff rejects the request
                value: { status: "REJECTED" }
              guestCancel:
                summary: Guest cancels a pending request
                value: { status: "CANCELLED" }
      responses:
        "200":
          description: Status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Service request status updated"
                  data:
                    $ref: "#/components/schemas/ServiceRequest"
        "400":
          $ref: "#/components/responses/OrderBadRequest"
        "401":
          $ref: "#/components/responses/OrderUnauthorized"
        "403":
          $ref: "#/components/responses/OrderForbidden"
        "404":
          description: Service request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderError"

  # ==================== UPDATE ORDER STATUS ====================
  /api/v1/{app}/orders/food/{orderId}/status:
    patch:
      tags:
        - Orders
      summary: Update order status (kitchen / staff)
      description: |
        Update food order status. Requires UPDATE_ORDER permission and hotel or chain context.
        Valid transitions - PENDING → PREPARING, PENDING → REJECTED; PREPARING → SERVED, PREPARING → REJECTED.
        Publishes analytics status-change event for ordersByStatus and time metrics.
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/OrdersAppParam"
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Order ID (MongoDB ObjectId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [PREPARING, SERVED, REJECTED]
                  description: New status for the order
      responses:
        "200":
          description: Order status updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Order status updated"
                  data:
                    $ref: "#/components/schemas/FoodOrder"
        "400":
          description: Invalid transition or bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderError"
        "403":
          description: Forbidden – no access to this order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderError"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderError"

components:
  parameters:
    OrdersAppParam:
      name: app
      in: path
      required: true
      schema:
        type: string
        enum: [admin, founder, customer-care, sales, manager, frontdesk, kitchen, room-service, customer]
      description: Application/panel (determines place-order behaviour and list filter)

  schemas:
    OrderItemInput:
      type: object
      description: "One line item. Required - itemId, itemName, price, quantity. Optional - discountedPrice, variantId, variantName, isUpsell (true for add-ons/suggested items)."
      required:
        - itemId
        - itemName
        - price
        - quantity
      properties:
        itemId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Menu item ID (MongoDB ObjectId)
        itemName:
          type: string
          minLength: 1
          maxLength: 200
          description: Display name of the item
        price:
          type: number
          minimum: 0
          description: Unit price (before discount)
        discountedPrice:
          type: number
          minimum: 0
          description: Optional discounted unit price; if omitted, price is used
        quantity:
          type: integer
          minimum: 1
          description: Number of units
        variantId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Optional variant ID when item has size/option (e.g. Large, Medium)
        variantName:
          type: string
          maxLength: 100
          description: Optional variant display name (e.g. Large, Medium)
        isUpsell:
          type: boolean
          default: false
          description: true when item is an add-on or suggested item (upsell)

    FoodOrder:
      type: object
      description: Order identity is MongoDB _id.
      properties:
        _id:
          type: string
          description: Order ID (MongoDB ObjectId)
        hotelId:
          type: string
        placedById:
          type: string
        source:
          type: string
          enum: [GUEST, STAFF_FOR_GUEST, STAFF]
        channelType:
          type: string
          enum: [ROOM, RESTAURANT, BAR, INTERNAL]
        customerId:
          type: string
          nullable: true
        roomSessionId:
          type: string
          nullable: true
        roomNumber:
          type: string
          nullable: true
        tableNumber:
          type: string
          nullable: true
        zone:
          type: string
          nullable: true
        cookingRequest:
          type: string
          nullable: true
          description: "Order-level free-text cooking request / special instructions."
        status:
          type: string
          enum: [PENDING, PREPARING, SERVED, REJECTED]
        acceptedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when status moves to PREPARING (kitchen accepted)
        servedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when status moves to SERVED
        rejectedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when status moves to REJECTED
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
        bill:
          type: object
          properties:
            subtotal: { type: number }
            serviceCharge: { type: number }
            gstAndOther: { type: number }
            toPay: { type: number }
        count:
          type: integer
        paymentStatus:
          type: string
          enum: [PENDING, PAID, REFUNDED]
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderListItem:
      type: object
      description: Order list item with optional hotel/customer enrichment by role. Order identity is _id.
      properties:
        _id: { type: string }
        hotelId: { type: string }
        placedById: { type: string }
        source: { type: string }
        channelType: { type: string }
        customerId: { type: string, nullable: true }
        roomSessionId: { type: string, nullable: true }
        roomNumber: { type: string, nullable: true }
        tableNumber: { type: string, nullable: true }
        zone: { type: string, nullable: true }
        cookingRequest: { type: string, nullable: true, description: "Order-level free-text cooking request." }
        status: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItemInput"
        bill:
          type: object
          properties:
            subtotal: { type: number }
            serviceCharge: { type: number }
            gstAndOther: { type: number }
            toPay: { type: number }
        count: { type: integer }
        paymentStatus: { type: string }
        paidAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        hotel:
          type: object
          description: Present for customer list and admin/chain list (name, address)
          nullable: true
          properties:
            name: { type: string }
            address: { type: string }
        customer:
          type: object
          description: Present for staff and admin/chain list (frontdesk, kitchen). User id, phone, name and profile picture.
          nullable: true
          properties:
            userId: { type: string }
            phone: { type: string }
            name: { type: string, description: "Customer display name" }
            profilePicture:
              type: string
              nullable: true
              description: Profile picture URL for display, or null if not set

    # ── Active order schemas (bottom bar + status pages) ─────────────────────

    ActiveFoodOrderSummary:
      type: object
      description: Minimal food order entry for the bottom tracking bar.
      properties:
        _id: { type: string, description: "Food order ID" }
        status:
          type: string
          enum: [PENDING, PREPARING]
        createdAt: { type: string, format: date-time }

    ActiveServiceRequestSummary:
      type: object
      description: Minimal service request entry for the bottom tracking bar.
      properties:
        _id: { type: string, description: "Service request ID" }
        status:
          type: string
          enum: [PENDING, ACCEPTED, IN_PROGRESS]
        createdAt: { type: string, format: date-time }

    ActiveFoodOrder:
      type: object
      description: Full food order data for the status page carousel.
      properties:
        _id: { type: string }
        status:
          type: string
          enum: [PENDING, PREPARING]
        channelType:
          type: string
          enum: [ROOM, RESTAURANT, BAR, INTERNAL]
        roomNumber: { type: string, nullable: true }
        cookingRequest: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              itemName: { type: string }
              quantity: { type: integer, minimum: 1 }
              variantName: { type: string, description: "Present only when a variant was selected" }
        bill:
          type: object
          properties:
            subtotal: { type: number }
            toPay: { type: number }
        count: { type: integer, description: "Total number of items (sum of quantity)" }
        acceptedAt:
          type: string
          format: date-time
          nullable: true
          description: "Set when kitchen moves status to PREPARING"
        createdAt: { type: string, format: date-time }
        hotel:
          type: object
          properties:
            name: { type: string }
            address: { type: string }

    ActiveServiceRequest:
      type: object
      description: Full service request data for the status page carousel.
      properties:
        _id: { type: string }
        status:
          type: string
          enum: [PENDING, ACCEPTED, IN_PROGRESS]
        roomNumber: { type: string }
        note: { type: string, nullable: true }
        items:
          type: array
          items:
            type: object
            properties:
              itemName: { type: string }
              categoryName: { type: string, description: "Use this to group items on the UI" }
              quantity: { type: integer, minimum: 1 }
        totalAmount: { type: number }
        acceptedAt:
          type: string
          format: date-time
          nullable: true
          description: "Set when staff moves status to ACCEPTED"
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: "Set when staff moves status to IN_PROGRESS"
        createdAt: { type: string, format: date-time }
        hotel:
          type: object
          properties:
            name: { type: string }
            address: { type: string }

    # ── Service Request schemas ───────────────────────────────────────────────

    ServiceRequestItemInput:
      type: object
      description: |
        Line item sent by the client — only `itemId` and `quantity`.
        The backend resolves `itemName`, `categoryId`, `categoryName`, and `price` from the DB
        to prevent price manipulation. Items that do not exist, do not belong to this hotel,
        or have `isActive: false` are rejected with a 400 error.
      required:
        - itemId
        - quantity
      properties:
        itemId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Service item ID (MongoDB ObjectId)
        quantity:
          type: integer
          minimum: 1
          description: Number of units

    ServiceRequestItemResolved:
      type: object
      description: Fully-resolved item stored in the DB after the backend enriches it from ServiceItem.
      properties:
        itemId: { type: string }
        itemName: { type: string }
        categoryId: { type: string }
        categoryName: { type: string }
        price: { type: number }
        quantity: { type: integer, minimum: 1 }

    ServiceRequest:
      type: object
      description: Full service request document returned after create / status update.
      properties:
        _id:
          type: string
          description: Request ID (MongoDB ObjectId)
        userId:
          type: string
          description: Guest who placed the request
        hotelId:
          type: string
        roomSessionId:
          type: string
        roomNumber:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRequestItemResolved"
        totalAmount:
          type: number
          description: Sum of (price × quantity) for all items, computed server-side from DB prices
        note:
          type: string
          nullable: true
          description: "Optional guest note (e.g. 'collect after 3pm')"
        status:
          type: string
          enum: [PENDING, ACCEPTED, IN_PROGRESS, COMPLETED, REJECTED, CANCELLED]
        paymentStatus:
          type: string
          enum: [PENDING, PAID, REFUNDED]
        paidAt:
          type: string
          format: date-time
          nullable: true
        acceptedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when staff moves status to ACCEPTED
        startedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when staff moves status to IN_PROGRESS
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when staff marks COMPLETED
        rejectedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when staff moves to REJECTED
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          description: Set when cancelled (staff or guest)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ServiceRequestListItem:
      type: object
      description: Service request list item with optional hotel/customer enrichment by role.
      properties:
        _id: { type: string }
        userId: { type: string }
        hotelId: { type: string }
        roomSessionId: { type: string }
        roomNumber: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRequestItemResolved"
        totalAmount: { type: number }
        note: { type: string, nullable: true }
        status:
          type: string
          enum: [PENDING, ACCEPTED, IN_PROGRESS, COMPLETED, REJECTED, CANCELLED]
        paymentStatus: { type: string }
        paidAt: { type: string, format: date-time, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        rejectedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        hotel:
          type: object
          nullable: true
          description: "Present for customer view: hotel name and address"
          properties:
            name: { type: string }
            address: { type: string }
        customer:
          type: object
          nullable: true
          description: "Present for staff/admin view: guest who placed the request"
          properties:
            userId: { type: string }
            phone: { type: string }
            name: { type: string }
            profilePicture: { type: string, nullable: true, description: "Profile picture URL or null" }

    # ── Shared error schema ───────────────────────────────────────────────────

    OrderError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Room context required. Please scan room QR or ensure cookies are set."

  responses:
    OrderBadRequest:
      description: Bad request (validation error or invalid state transition)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrderError"
    OrderUnauthorized:
      description: Unauthorized – missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrderError"
    OrderForbidden:
      description: Forbidden – insufficient permissions or wrong hotel/chain context
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OrderError"
